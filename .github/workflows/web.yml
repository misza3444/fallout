name: Build and publish STREFA ZERO Web
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strefa-zero-web-build
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Godot 4.7.2 with export templates
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Import and validate GDScript
        shell: bash
        run: |
          set -eo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee /tmp/godot-import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:' /tmp/godot-import.log; then exit 1; fi
      - name: Smoke-test game startup
        shell: bash
        run: |
          set -eo pipefail
          godot --headless --path . --quit-after 60 2>&1 | tee /tmp/godot-runtime.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:|Invalid call' /tmp/godot-runtime.log; then exit 1; fi
      - name: Check save and settings persistence
        shell: bash
        run: |
          set -eo pipefail
          godot --headless --path . --script res://tools/check_foundation.gd 2>&1 | tee /tmp/godot-foundation.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:' /tmp/godot-foundation.log; then exit 1; fi
      - name: Export HTML5
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p public
          godot --headless --path . --export-release "Web" public/index.html 2>&1 | tee /tmp/godot-export.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:' /tmp/godot-export.log; then exit 1; fi
          test -s public/index.html
          test -s public/index.js
          test -s public/index.wasm
          test -s public/index.pck
          du -h public/*
      - name: Upload downloadable Web build
        uses: actions/upload-artifact@v4
        with:
          name: strefa-zero-web
          path: public/
          retention-days: 14
      - name: Publish to gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          PAGES_DIR="$RUNNER_TEMP/strefa-pages"
          git worktree add -B gh-pages "$PAGES_DIR" origin/gh-pages
          find "$PAGES_DIR" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a public/. "$PAGES_DIR/"
          touch "$PAGES_DIR/.nojekyll"
          git -C "$PAGES_DIR" add -A
          if git -C "$PAGES_DIR" diff --cached --quiet; then
            echo "No web changes to publish."
          else
            git -C "$PAGES_DIR" commit -m "deploy(web): update STREFA ZERO [skip ci]"
            git -C "$PAGES_DIR" push origin HEAD:gh-pages
          fi
          echo "::notice::Static game built on gh-pages. To enable URL, set Pages Source to Deploy from a branch, Branch gh-pages, Folder /(root)."
