name: Build Godot Web for Vercel
on:
  push:
    branches: [main]
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - 'scenes/**'
      - 'scripts/**'
      - 'shaders/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-web-build
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Godot 4.7.2 with templates
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Import and validate scripts
        shell: bash
        run: |
          set -eo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee /tmp/godot-import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:' /tmp/godot-import.log; then exit 1; fi
      - name: Smoke-run startup scene
        shell: bash
        run: |
          set -eo pipefail
          godot --headless --path . --quit-after 60 2>&1 | tee /tmp/godot-runtime.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:|Invalid call' /tmp/godot-runtime.log; then exit 1; fi
      - name: Export optimized Web build
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p public
          godot --headless --path . --export-release "Web" public/index.html 2>&1 | tee /tmp/godot-export.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:' /tmp/godot-export.log; then exit 1; fi
          test -s public/index.html
          test -s public/index.js
          test -s public/index.wasm
          test -s public/index.pck
          du -h public/*
      - name: Save downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: strefa-zero-vercel-static
          path: public/
          retention-days: 14
      - name: Commit deployable static assets to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/
          if git diff --cached --quiet; then
            echo "No change in Web assets."
          else
            git commit -m "build(web): refresh Godot Vercel static output [skip ci]"
            git push origin HEAD:main
          fi
