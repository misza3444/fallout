name: Build and deploy Godot Web
on:
  push:
    branches: [main]
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - 'scenes/**'
      - 'scripts/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: godot-web-pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 with templates
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Import and parse project
        run: |
          godot --headless --path . --editor --quit 2>&1 | tee /tmp/godot-import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:' /tmp/godot-import.log; then exit 1; fi
      - name: Build HTML5
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html 2>&1 | tee /tmp/godot-export.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:' /tmp/godot-export.log; then exit 1; fi
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: strefa-zero-web
          path: build/web/
          retention-days: 14
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/
      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
